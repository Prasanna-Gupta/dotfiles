# Prasanna OS — kitty
# Colours come from theme.conf, generated by matugen (hook 03) on wallpaper change.

font_family          JetBrainsMono Nerd Font
bold_font            auto
italic_font          auto
font_size            11.0
disable_ligatures    cursor

window_padding_width 14
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell    no
remember_window_size yes

# KWin blurs the translucent background itself (Wayland)
background_blur      32
dynamic_background_opacity yes

cursor_shape         beam
cursor_trail         3
cursor_trail_decay   0.1 0.3

scrollback_lines     20000
copy_on_select       clipboard
strip_trailing_spaces smart
url_style            curly

# Tabs: hidden until a second tab exists
tab_bar_edge         bottom
tab_bar_min_tabs     2
tab_bar_style        powerline
tab_powerline_style  round
tab_title_template   "{index}: {title}"

# New tab / split in the current directory
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+\     launch --cwd=current --location=hsplit
enabled_layouts      splits,stack

include theme.conf
