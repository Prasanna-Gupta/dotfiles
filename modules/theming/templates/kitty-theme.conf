# Generated by Prasanna OS Theme Engine
# Do not edit manually - edit ~/.config/matugen/templates/kitty-theme.conf

# Background and foreground
background              {{colors.surface.dark.hex}}
foreground              {{colors.on_surface.dark.hex}}

# Cursor
cursor                  {{colors.primary.dark.hex}}
cursor_text_color       {{colors.on_primary.dark.hex}}

# Selection
selection_background    {{colors.primary_container.dark.hex}}
selection_foreground    {{colors.on_primary_container.dark.hex}}

# URL color
url_color               {{colors.tertiary.dark.hex}}

# Tab bar
active_tab_background   {{colors.primary_container.dark.hex}}
active_tab_foreground   {{colors.on_primary_container.dark.hex}}
inactive_tab_background {{colors.surface_container.dark.hex}}
inactive_tab_foreground {{colors.on_surface_variant.dark.hex}}

# Window border
active_border_color     {{colors.primary.dark.hex}}
inactive_border_color   {{colors.outline_variant.dark.hex}}

# Background opacity (keep your current value)
background_opacity      0.90

